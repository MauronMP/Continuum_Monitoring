[deployment]
topology_file = "configs/topologies/physical/topology.toml"
topology_name = "physical"
# All six physical hosts are active; exclusions must always be explicit.
ssh_user = "pi"
remote_dir = "/home/pi/continuum-container-scale"
image = "continuum-worker:container-scale-v1"
install_dl = false
base_port = 8491
# One container per host initially. Add 2 only after reviewing doctor evidence.
containers_per_host = [1]
# Exclusions must be explicit; the CLI also accepts --exclude-host mist.
exclude_hosts = []
cpu_per_container = 1.0
memory_mib_per_container = 1536
reserve_memory_mib = 1536
minimum_free_disk_mib = 4096
health_timeout_seconds = 120
# Cold DL builds over a relayed VPN can exceed 30 minutes. This is a
# deployment-operation budget, independent of benchmark request/point deadlines.
operation_timeout_seconds = 7200

[experiment]
repetitions = 3
warmup = 1
seed = 2026
request_timeout_seconds = 120
point_timeout_seconds = 600
# Override per invocation with repeated --reasoner (for example rdfs and jfact).
# Persistent DL selection also requires deployment.install_dl = true.
reasoners = ["rdfs"]
layouts = ["distributed", "replicated"]
semantic_validation = true
# Explicit bounded deadlines; unlimited is optional, never the default.

# User counts are synthetic workload entities; concurrency is a separate axis.
[[scenarios]]
name = "users-1"
family = "users"
users = 1
target_triples = 0
concurrency = [1]
query_rounds = 1

