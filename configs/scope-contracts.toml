[items."P-NODE-06"]
original_statement = "If no external node meets minimum eligibility and trust requirements, the system must not force a higher tier. It must prefer retention, local degradation or deferral and record the absence of alternatives."
statement = "If no configured resource tier matches the active monitoring rules, the policy engine must return an empty resource selection rather than silently selecting a higher tier. This is a planning boundary, not an operational trust assessment or a physical retention actuator."
