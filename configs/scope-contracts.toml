# Explicit current-release scope; original statements are retained for change review.
version = 1
ontology_revision = "4.0.0-monitoringcontinuum-v2"

[items."RF-07"]
original_statement = "The system must manage preprocessing and energy strategy according to context. When connectivity is limited or effective consent restricts processing to the local scope, data must be preprocessed on the device itself or in the Mist tier. When the battery is low, the system must reduce model complexity and non-critical transmissions; when the battery is critical, it must prioritize offloading to the highest authorized tier only if sufficient connectivity exists and consent, the contract and zone policy allow it. If the battery is critical and transfer is not authorized, it must apply local degradation and temporary retention."
statement = "The reference monitoring model must expose device battery, connection status and data readiness, together with the consent context used to interpret local operation. This requirement covers queryable decision inputs; automatic energy management, preprocessing and offloading on physical devices are outside this release."
verification_kind = "model-query"
queries = ["BASE-Q10", "BASE-Q15"]
evidence = "tests/monitoring/test_policy_evaluation.py"

[items."RF-41"]
original_statement = "The system must link users, nodes, zones, contracts or evaluations to specific policies through `governedBy`."
statement = "Reference semantic contracts must expose their governing policies through governedBy. Evaluation and action records must expose the policy justification checked by the audit queries. This requirement does not impose governedBy on every user, node or zone."
verification_kind = "model-query"
queries = ["EXT-Q12", "EXT-Q72"]
evidence = "queries/core/policy_governance"

[items."RF-44"]
original_statement = "The system must record the specific policy applied in every evaluation, degradation, migration, delegation or model-selection decision."
statement = "Each reference evaluation that records an adaptation action must identify an applied policy, and each recorded adaptation action must identify its authorizing evaluation. Audit queries must detect missing links; the records do not prove physical execution of migration or degradation."
verification_kind = "model-query"
queries = ["EXT-Q72"]
evidence = "queries/core"

[items."RF-52"]
original_statement = "The system must favor local or Edge models when the privacy weight is dominant or when consent does not allow global aggregation."
statement = "The reference model must expose privacy and other decision weights, the selected model tier and its justification. A recorded Cloud selection without global consent, a permitted zone and granted authorization must be detectable. Automatic privacy-weight optimization is outside this release."
verification_kind = "model-query"
queries = ["EXT-Q46", "EXT-Q56"]
evidence = "ontology/examples/reference-system.ttl"

[items."RF-69"]
original_statement = "The system must expose the ontology through a SPARQL 1.1 endpoint. Apache Jena Fuseki is the reference environment for reproducibility; equivalent endpoints may be used in operation provided they remain compatible with RDF/OWL/Turtle and SPARQL 1.1 and pass the same validation battery."
statement = "Physical workers must execute registered query identifiers from the versioned SPARQL catalogue through the project worker protocol. Arbitrary client-supplied SPARQL and a public SPARQL 1.1 HTTP endpoint are outside this release."
verification_kind = "software-check"
queries = []
evidence = "tests/monitoring/test_distributed.py"

[items."RNF-03"]
original_statement = "Peak-load scenarios must maintain service within the limits declared in the acceptance profile and, when degradation, migration, delegation or retention is necessary, degradation must be controlled and auditable."
statement = "Bounded monitoring experiments must record completion, timeout and failure separately. With keep-going enabled, independent later points must remain eligible for execution under the configured skip rules. These measurements do not guarantee service-level acceptance or automatic physical degradation."
verification_kind = "software-check"
queries = []
evidence = "tests/monitoring/test_load_benchmark.py"

[items."RNF-10"]
original_statement = "The ontology must support adding new users, nodes, sensors, models, policies and contracts through instance extensions or compatible specializations, without modifying the central conceptual abstractions used by existing scenarios."
statement = "The maintained synthetic workload must add supported user and related instance records deterministically, without changing the ontology schema. Module import closure must remain valid. Other instance types or specializations require explicit validation before they enter the baseline."
