original_statement = "During partial failures, critical functions authorized for local execution must remain operational and pending data/events must retain integrity until synchronization or authorized disposal."
statement = "A failed or timed-out monitoring point must remain an explicit outcome. Under keep-going, subsequent independent points may execute according to the configured skip rules. This policy does not guarantee continuity of application services or durable synchronization during a physical failure."
