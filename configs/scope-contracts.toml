[items."P-ADAPT-08"]
original_statement = "Migration, delegation, reconnection and recovery processes must not lose critical events or create accidental duplicates. Retryable operations must have idempotent semantics where applicable."
statement = "Reference ReplicationEvent and SynchronizationEvent records must declare replicationVersion and idempotencyKey; the validation query must identify missing fields. This metadata contract does not guarantee exactly-once physical delivery, durable buffering or duplicate-free migration."
