original_statement = "When context, consent, contract, zone, connectivity, load or trust changes and the current selection becomes invalid, a new evaluation must start and complete within the configured reselection limit."
statement = "For each supplied context in the controlled monitoring experiment, the policy engine must recompute the active rules and resulting monitoring plan and record its evaluation time. It must not reuse a previous context plan implicitly. Live context detection and model-reselection deadlines are outside this release."
