  "topology",
  "semantic_schema",
  "observability",
  "decision",
  "consent",
  "contract_compliance",
  "access_control",
  "policy",
  "migration",
  "delegation",
  "federation",
  "privacy",
  "context",
  "wellbeing",
]
scale_users = [5, 25]
repetitions = 1
seed = 2026
