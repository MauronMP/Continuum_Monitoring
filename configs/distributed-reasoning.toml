[experiment]
repetitions = 5
request_timeout_seconds = 300
point_timeout_seconds = 1800
seed = 2026
users = 0
rule_count = 0
padding_mode = "neutral"
stop_after_timeout = false
semantic_validation = true

[matrix]
target_triples = [50000, 100000, 250000, 500000, 1000000, 2000000]
node_counts = [1, 2, 3, 5, 6]
layouts = ["distributed", "replicated"]
reasoners = ["rdfs", "hermit", "openllet", "jfact", "konclude"]
tasks = [
  "rdfs_closure",
  "owl_dl_classification_realization",
]

[scaling]
strong = true
weak = true
weak_triples_per_node = 200000

[statistics]
bootstrap_samples = 2000
confidence_level = 0.95

[queries]
concurrency = [1, 4, 16]
rounds = 3
