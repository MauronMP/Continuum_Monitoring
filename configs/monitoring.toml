[monitoring_experiment]
benchmark_config = "benchmark.toml"
scenarios = ["users-1000"]
layouts = ["distributed"]
demand_levels = ["low", "normal", "high", "critical"]
stabilization_seconds = 30
measurement_seconds = 300
repetitions = 3
resource_sample_interval_seconds = 1.0
physical_query_request_timeout_seconds = 120
logical_query_timeout_seconds = 120
recovery_idle_timeout_seconds = 30
restart_ready_timeout_seconds = 120
minimum_recommended_cycles_per_task = 3
include_idle = true

[[monitoring_task]]
task_id = "operational-node-state"
policy_id = "P-NODE-01"
query_ids = ["BASE-Q07", "BASE-Q08", "BASE-Q26"]
priority = 100
intervals_seconds = { low = 60, normal = 30, high = 10, critical = 5 }
deadlines_seconds = { low = 45, normal = 20, high = 8, critical = 5 }

[[monitoring_task]]
task_id = "device-transmission-state"
policy_id = "P-DATA-06"
query_ids = ["BASE-Q10"]
priority = 90
intervals_seconds = { low = 120, normal = 60, high = 30, critical = 15 }
deadlines_seconds = { low = 60, normal = 30, high = 20, critical = 10 }

