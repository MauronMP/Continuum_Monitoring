[campaign]
name = "physical-scalability"
reasoners = ["rdfs", "owlrl", "rdfs_owlrl"]
modes = ["replicated", "distributed"]
policy_categories = ["identity_consent", "security_identity", "policy_governance"]
repetitions = 3
warmup = 3
seed = 2026
request_timeout_seconds = 30
point_timeout_seconds = 90

[workload]
physical_nodes = 1
iot_devices = 2
users = 2
requests = 32
policies = 2
individuals = 2
requirements = 2
query_count = 2
query_complexity = 1
concurrency = 1

