[cluster]
description = "One local cloud coordinator and four Raspberry Pi 500 workers"
ssh_user = "pi"
remote_dir = "/home/{ssh_user}/continuum-bench"
remote_python = "/home/{ssh_user}/continuum-bench/.venv-node/bin/python"

[[nodes]]
role = "cloud"
host = "127.0.0.1"
endpoint = "http://127.0.0.1:8391"
local = true
port = 8391

[[nodes]]
role = "fog"
host = "192.168.1.137"
endpoint = "http://192.168.1.137:8391"
local = false
port = 8391

[[nodes]]
role = "edge1"
host = "192.168.1.138"
endpoint = "http://192.168.1.138:8391"
local = false
port = 8391

[[nodes]]
role = "edge2"
host = "192.168.1.139"
endpoint = "http://192.168.1.139:8391"
local = false
port = 8391

[[nodes]]
role = "edge3"
host = "192.168.1.140"
endpoint = "http://192.168.1.140:8391"
local = false
port = 8391
