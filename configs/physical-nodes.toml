# Legacy compatibility inventory. New deployments should edit the layer files
# in configs/topologies/physical/nodes/.
[cluster]
description = "One local cloud coordinator and four Raspberry Pi 500 workers"
ssh_user = "pi"
remote_dir = "/home/{ssh_user}/continuum-bench"
remote_python = "/home/{ssh_user}/continuum-bench/.venv-node/bin/python"

[[nodes]]
role = "cloud"
host = "127.0.0.1"
endpoint = "http://127.0.0.1:8391"
local = true
port = 8391

[[nodes]]
role = "fog"
host = "10.151.73.241"
endpoint = "http://10.151.73.241:8391"
local = false
port = 8391

[[nodes]]
role = "edge1"
host = "10.151.73.34"
endpoint = "http://10.151.73.34:8391"
local = false
port = 8391

[[nodes]]
