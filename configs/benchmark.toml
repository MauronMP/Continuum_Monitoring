[paths]
ontology_files = [
  "ontology/core/schema.ttl",
  "ontology/modules/foundation.ttl",
  "ontology/modules/topology.ttl",
  "ontology/modules/observability.ttl",
  "ontology/modules/governance.ttl",
  "ontology/modules/orchestration.ttl",
  "ontology/modules/federation.ttl",
  "ontology/modules/deployment.ttl",
  "ontology/core/vocabulary.ttl",
  "ontology/domains/wellbeing/schema.ttl",
  "ontology/domains/wellbeing/vocabulary.ttl",
  "ontology/examples/reference-system.ttl",
  "ontology/shapes/core-compliance.ttl",
  "ontology/shapes/federated-learning.ttl",
]
shape_files = [
  "ontology/shapes/core-compliance.ttl",
  "ontology/shapes/federated-learning.ttl",
]
query_catalog = "queries/catalog.csv"
topology_file = "configs/topology.toml"
output_dir = "outputs"

[distributed]
# Bound each remote request, not the whole benchmark stage. Queries are split
# into small batches so low-power physical nodes report progress and one slow
# query cannot force the complete 70+ query authority workload to be repeated.
request_timeout_seconds = 900
request_retries = 0
query_batch_size = 8
worker_timeout_margin_seconds = 5

[benchmark]
reasoners = ["rdfs", "owlrl", "rdfs_owlrl"]
category_order = [
  "topology",
  "semantic_schema",
  "observability",
  "identity_consent",
  "data_lifecycle",
  "security_identity",
  "context_zones",
  "trust",
  "decision",
  "policy_governance",
  "adaptation",
  "delegation",
  "federation",
  "audit_temporal",
  "validation",
  "wellbeing",
]
scale_users = [10, 100, 500, 1000, 2500, 5000]
repetitions = 3
seed = 2026
