[deployment]
topology_file = "configs/topology.toml"
remote_dir = "/home/pi/continuum-rdf-benchmark"
ssh_user = "pi"
image = "continuum-worker:rust-v1"
containers_per_host = 1
cpu_per_container = 1.0
memory_mib_per_container = 1536
max_prepare_mib = 256
reserve_memory_mib = 1536
minimum_free_disk_mib = 4096
health_timeout_seconds = 120
operation_timeout_seconds = 7200

[experiment]
seed = 2026
warmup = 1
repetitions = 3
query_rounds = 18
physical_query_request_timeout_seconds = 120
logical_query_timeout_seconds = 120
recovery_timeout_seconds = 120
prepare_operational_target_seconds = 120
prepare_hard_timeout_seconds = 600
layouts = ["distributed", "replicated"]
resource_sample_interval_seconds = 1.0

[[scenarios]]
name = "users-1"
users = 1

