[paths]
ontology_files = [
  "ontology/core/schema.ttl",
  "ontology/modules/foundation.ttl",
  "ontology/modules/contracts.ttl",
  "ontology/modules/topology.ttl",
  "ontology/modules/observability.ttl",
  "ontology/modules/governance.ttl",
  "ontology/modules/orchestration.ttl",
  "ontology/modules/federation.ttl",
  "ontology/modules/deployment.ttl",
  "ontology/core/vocabulary.ttl",
  "ontology/domains/wellbeing/schema.ttl",
  "ontology/domains/wellbeing/vocabulary.ttl",
  "ontology/examples/reference-system.ttl",
  "ontology/shapes/core-compliance.ttl",
  "ontology/shapes/federated-learning.ttl",
]
shape_files = [
  "ontology/shapes/core-compliance.ttl",
  "ontology/shapes/federated-learning.ttl",
]
query_catalog = "queries/catalog.csv"
topology_file = "configs/topologies/physical/topology.toml"
output_dir = "outputs"

[distributed]
# Five minutes bounds one worker request. A timeout remains a right-censored
# observation and later points continue so one slow profile does not erase the
# remainder of the matrix.
request_timeout_seconds = 300
request_retries = 0
query_batch_size = 4
worker_timeout_margin_seconds = 2

[limits]
# Bounded is recommended and enforces budgets. Unlimited is optional and can
# block indefinitely when a native reasoner does not return.
timeout_mode = "bounded"
# Independent timeout-only skip triggers. Real errors remain errors.
consecutive_timeout_threshold = 1
skip_repetitions_after_timeout = false
skip_larger_sizes_after_timeout = false
skip_cumulative_stages_after_timeout = false
# In bounded mode an exceeded phase/point budget is recorded as a timeout.
# The explicit triggers above determine whether later observations are omitted.
phase_timeout_seconds = 300
point_timeout_seconds = 900
calibration_query_limit = 16
stop_scaling_after_timeout = false

[benchmark]
reasoners = ["rdfs", "hermit", "openllet", "jfact", "konclude"]
category_order = [
  "topology",
  "semantic_schema",
  "observability",
  "identity_consent",
  "data_lifecycle",
  "security_identity",
  "context_zones",
  "trust",
  "decision",
  "policy_governance",
  "adaptation",
  "delegation",
  "federation",
  "audit_temporal",
  "validation",
  "wellbeing",
]
scale_users = [10, 100, 500, 1000, 2500, 5000]
repetitions = 3
seed = 2026
