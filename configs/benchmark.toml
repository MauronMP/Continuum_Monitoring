[paths]
ontology_files = [
  "ontology/core/schema.ttl",
  "ontology/modules/foundation.ttl",
  "ontology/modules/topology.ttl",
  "ontology/modules/observability.ttl",
  "ontology/modules/governance.ttl",
  "ontology/modules/orchestration.ttl",
  "ontology/modules/federation.ttl",
  "ontology/modules/deployment.ttl",
  "ontology/core/vocabulary.ttl",
  "ontology/domains/wellbeing/schema.ttl",
  "ontology/domains/wellbeing/vocabulary.ttl",
  "ontology/examples/reference-system.ttl",
  "ontology/shapes/core-compliance.ttl",
  "ontology/shapes/federated-learning.ttl",
]
shape_files = [
  "ontology/shapes/core-compliance.ttl",
  "ontology/shapes/federated-learning.ttl",
]
query_catalog = "queries/catalog.csv"
topology_file = "configs/topology.toml"
output_dir = "outputs"

[distributed]
# One minute is the response-time acceptance ceiling. A timeout is persisted as
# a right-censored observation and does not abort the complete suite.
request_timeout_seconds = 60
request_retries = 0
query_batch_size = 4
worker_timeout_margin_seconds = 2

[limits]
# A phase or complete measurement point that exceeds these limits is not timed
# to completion. Larger scalability points are recorded as skipped because the
# first timeout already establishes that the acceptance ceiling was exceeded.
phase_timeout_seconds = 60
point_timeout_seconds = 90
calibration_query_limit = 16
stop_scaling_after_timeout = true

[benchmark]
reasoners = ["rdfs", "owlrl", "rdfs_owlrl"]
category_order = [
  "topology",
  "semantic_schema",
  "observability",
  "identity_consent",
  "data_lifecycle",
  "security_identity",
  "context_zones",
  "trust",
  "decision",
  "policy_governance",
  "adaptation",
  "delegation",
  "federation",
  "audit_temporal",
  "validation",
  "wellbeing",
]
scale_users = [10, 100, 500, 1000, 2500, 5000]
repetitions = 3
seed = 2026
