[validation]
ontology_files = [
  "ontology/core/schema.ttl",
  "ontology/modules/foundation.ttl",
  "ontology/modules/topology.ttl",
  "ontology/modules/observability.ttl",
  "ontology/modules/governance.ttl",
  "ontology/modules/orchestration.ttl",
  "ontology/modules/federation.ttl",
  "ontology/modules/deployment.ttl",
  "ontology/core/vocabulary.ttl",
  "ontology/domains/wellbeing/schema.ttl",
  "ontology/domains/wellbeing/vocabulary.ttl",
  "ontology/examples/reference-system.ttl",
  "ontology/shapes/core-compliance.ttl",
  "ontology/shapes/federated-learning.ttl",
]
timeout_seconds = 180
reasoners = ["hermit", "openllet", "jfact", "konclude"]

[reasoners.hermit]
kind = "owlapi"
classpath_env = "CONTINUUM_HERMIT_CLASSPATH"

[reasoners.openllet]
kind = "owlapi"
classpath_env = "CONTINUUM_OPENLLET_CLASSPATH"

[reasoners.jfact]
kind = "owlapi"
classpath_env = "CONTINUUM_JFACT_CLASSPATH"

[reasoners.konclude]
kind = "command"
timeout_seconds = 180
command = ["{python}", "{root}/tools/owl/run_konclude.py", "consistency", "-w", "AUTO", "-i", "{ontology}"]
consistent_pattern = "(?i)ontology(?:\\s+['\"][^'\"]+['\"])?\\s+is\\s+consistent\\b|ontology\\s+consistent\\b|consistent\\s*[:=]\\s*true"
inconsistent_pattern = "(?i)ontology(?:\\s+['\"][^'\"]+['\"])?\\s+is\\s+inconsistent\\b|ontology\\s+inconsistent\\b|consistent\\s*[:=]\\s*false"
