port = 8079
local = true
authority = true
categories = [
  "topology",
  "semantic_schema",
  "observability",
  "identity_consent",
  "data_lifecycle",
  "security_identity",
  "context_zones",
  "trust",
  "decision",
  "policy_governance",
  "adaptation",
  "delegation",
