[layer]
tier = "fog"

[[nodes]]
id = "fog"
device_type = "docker-container"
host = "127.0.0.1"
endpoint = "http://127.0.0.1:8192"
port = 8192
container_port = 8080
local = true
authority = false

[nodes.resources]
cpu_cores = 1.0
cpu_architecture = "container-native"
ram = "1g"
storage_mib = 4096
processing_capacity = 1.0
network_mbps = 1000

[nodes.location]
region = "local-docker"
