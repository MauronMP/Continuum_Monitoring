name: continuum-semantic-engines

x-python-engine: &python-engine
  image: continuum-benchmark-node:latest
  pull_policy: never
  init: true
  restart: "no"
  cpus: "${CONTINUUM_ENGINE_CPUS:-2.0}"
  mem_limit: "${CONTINUUM_ENGINE_MEMORY:-3g}"
  # Avoid periodic probe processes perturbing short timing samples. The
  # coordinator calls /health synchronously before every experiment.
  healthcheck:
    disable: true
  command:
    - python
    - -m
    - continuum_bench.external_node
    - --host
    - 0.0.0.0
    - --port
    - "8080"
  networks:
    - engines

x-java-engine: &java-engine
  image: continuum-semantic-java-engines:latest
  pull_policy: never
  init: true
  restart: "no"
  cpus: "${CONTINUUM_ENGINE_CPUS:-2.0}"
  mem_limit: "${CONTINUUM_ENGINE_MEMORY:-3g}"
  networks:
    - engines

services:
  rdflib:
    <<: *python-engine
    build:
      context: .
      dockerfile: docker/Dockerfile
    environment:
      CONTINUUM_ENGINE: rdflib
    ports:
      - "127.0.0.1:8291:8080"

  jena:
    <<: *java-engine
    build:
      context: .
      dockerfile: docker/engines/Dockerfile
    environment:
      CONTINUUM_ENGINE: jena
      JAVA_TOOL_OPTIONS: "${CONTINUUM_JAVA_OPTIONS:--Xms128m -Xmx2g}"
    ports:
      - "127.0.0.1:8292:8080"

  rdf4j:
    <<: *java-engine
    environment:
      CONTINUUM_ENGINE: rdf4j
      JAVA_TOOL_OPTIONS: "${CONTINUUM_JAVA_OPTIONS:--Xms128m -Xmx2g}"
    ports:
      - "127.0.0.1:8293:8080"

  oxigraph:
    <<: *python-engine
    environment:
      CONTINUUM_ENGINE: oxigraph
    ports:
      - "127.0.0.1:8294:8080"

networks:
  engines:
    driver: bridge
