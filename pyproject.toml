[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "continuum-rdf-benchmark"
version = "0.1.0"
description = "Control plane for a physical Docker RDF scalability benchmark"
requires-python = ">=3.11"
dependencies = ["matplotlib>=3.9,<4", "numpy>=2,<3"]

[project.optional-dependencies]
test = ["pytest>=8,<10", "ruff>=0.12,<1"]

[project.scripts]
continuum-bench = "continuum_bench.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
ignore = ["BLE001"]
