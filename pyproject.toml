[build-system]
requires = ["setuptools==84.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "continuum-monitoring-benchmark"
version = "0.5.0"
description = "Reproducible evaluation of policy-driven monitoring on a physical computing continuum"
requires-python = ">=3.11"
dependencies = [
    "matplotlib>=3.8,<4",
    "numpy>=1.26,<3",
    "owlrl>=7.1,<8",
    "pyshacl>=0.30,<1",
    "rdflib>=7.1,<8",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9"]

[project.scripts]
continuum-bench = "continuum_bench.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
