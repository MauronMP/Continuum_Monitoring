[build-system]
requires = ["setuptools==84.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "continuum-ontology-benchmark"
version = "0.3.1"
description = "Reproducible ontology benchmarks for policy-aware continuum monitoring"
requires-python = ">=3.11"
dependencies = [
    "matplotlib>=3.8,<4",
    "numpy>=1.26,<3",
    "owlrl>=7.1,<8",
    "pyoxigraph>=0.5.9,<0.6",
    "pyshacl>=0.30,<1",
    "rdflib>=7.1,<8",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9"]
diagrams = ["reportlab>=4.4,<5"]

[project.scripts]
continuum-bench = "continuum_bench.cli:main"
continuum-smoke-cumulative = "continuum_bench.monitoring.smoke:main_cumulative"
continuum-smoke-scalability = "continuum_bench.monitoring.smoke:main_scalability"
continuum-smoke-physical-cumulative = "continuum_bench.monitoring.smoke:main_cumulative"
continuum-smoke-physical-scalability = "continuum_bench.monitoring.smoke:main_scalability"
continuum-smoke-physical-load = "continuum_bench.monitoring.smoke:main_physical_load"
continuum-smoke-physical-experiments = "continuum_bench.monitoring.smoke:main_physical_experiments"
continuum-smoke-engines = "continuum_bench.monitoring.smoke:main_engines"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
markers = [
    "smoke_cumulative: verifies the cumulative benchmark workflow",
    "smoke_scalability: verifies the scalability benchmark workflow",
    "owl_consistency: optional OWLAPI/HermiT integration using an installed Protege and Java",
]
