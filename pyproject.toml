[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "continuum-ontology-benchmark"
version = "0.1.0"
description = "Reproducible ontology benchmarks for policy-aware continuum monitoring"
requires-python = ">=3.11"
dependencies = [
    "matplotlib>=3.8,<4",
    "numpy>=1.26,<3",
    "owlrl>=7.1,<8",
    "pyoxigraph>=0.5.9,<0.6",
    "pyshacl>=0.30,<1",
    "rdflib>=7.1,<8",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9"]

[project.scripts]
continuum-bench = "continuum_bench.cli:main"
continuum-smoke-cumulative = "continuum_bench.smoke:main_cumulative"
continuum-smoke-scalability = "continuum_bench.smoke:main_scalability"
continuum-report = "continuum_bench.reporting:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
markers = [
    "smoke_cumulative: verifies the cumulative benchmark workflow",
    "smoke_scalability: verifies the scalability benchmark workflow",
]
