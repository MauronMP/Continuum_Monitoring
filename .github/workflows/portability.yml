name: Clean installation and semantic smokes

on: [push, pull_request, workflow_dispatch]

permissions:
  contents: read

jobs:
  python:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-14]
        python: ['3.11', '3.12', '3.13']
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/cache@v4
        with:
          path: .cache/pip
          key: pip-${{ runner.os }}-${{ matrix.python }}-${{ hashFiles('requirements/*.txt', 'pyproject.toml') }}
      - run: python tools/bootstrap.py
      - run: .venv/bin/python -m pytest
      - run: .venv/bin/continuum-bench validate
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: setup-${{ matrix.os }}-${{ matrix.python }}
          path: outputs/runtime/setup/

  docker:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python tools/bootstrap.py --with-docker
      - run: .venv/bin/continuum-smoke-cumulative
      - run: .venv/bin/continuum-smoke-scalability
      - run: docker compose up -d --no-build
      - run: .venv/bin/continuum-bench --config configs/smoke-scalability.toml docker all --topology-only --output-dir outputs/ci-docker
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: docker-smokes
          path: outputs/
      - if: always()
        run: |
          docker compose down
          docker compose -f docker-compose.engines.yml down
