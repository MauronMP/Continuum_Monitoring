name: Software and semantic validation

on: [push, pull_request, workflow_dispatch]

permissions:
  contents: read

jobs:
  validation:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.14']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python tools/bootstrap.py
      # Scientific campaigns require the physical VPN inventory and run separately.
      - run: .venv/bin/python -m pytest
      - run: .venv/bin/python tools/check_documentation.py
      - run: .venv/bin/python tools/audit_ontology_modules.py
      - run: .venv/bin/python tools/review_validation_debt.py
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: validation-${{ matrix.python }}
          path: |
            outputs/runtime/setup/
            outputs/audit/
