name: continuum-benchmark

x-node: &node
  image: continuum-benchmark-node:latest
  # A local project image, not an image published on Docker Hub.
  pull_policy: never
  init: true
  restart: "no"
  cpus: "${CONTINUUM_NODE_CPUS:-1.0}"
  mem_limit: "${CONTINUUM_NODE_MEMORY:-1g}"
  networks:
    - continuum

services:
  cloud:
    <<: *node
    # Build once for all five services; avoid concurrent exports to one tag.
    build:
      context: .
      dockerfile: docker/Dockerfile
    hostname: cloud
    environment:
      CONTINUUM_ROLE: cloud
    ports:
      - "127.0.0.1:8191:8080"

  fog:
    <<: *node
    hostname: fog
    environment:
      CONTINUUM_ROLE: fog
    ports:
      - "127.0.0.1:8192:8080"

  edge1:
    <<: *node
    hostname: edge1
    environment:
      CONTINUUM_ROLE: edge1
    ports:
      - "127.0.0.1:8193:8080"

  edge2:
    <<: *node
    hostname: edge2
    environment:
      CONTINUUM_ROLE: edge2
    ports:
      - "127.0.0.1:8194:8080"

  edge3:
    <<: *node
    hostname: edge3
    environment:
      CONTINUUM_ROLE: edge3
    ports:
      - "127.0.0.1:8195:8080"

networks:
  continuum:
    driver: bridge
