name: continuum-benchmark

x-node: &node
  build:
    context: .
    dockerfile: docker/Dockerfile
  image: continuum-benchmark-node:latest
  init: true
  restart: "no"
  cpus: "${CONTINUUM_NODE_CPUS:-1.0}"
  mem_limit: "${CONTINUUM_NODE_MEMORY:-1g}"
  networks:
    - continuum

services:
  cloud:
    <<: *node
    hostname: cloud
    environment:
      CONTINUUM_ROLE: cloud
    ports:
      - "8191:8080"

  fog:
    <<: *node
    hostname: fog
    environment:
      CONTINUUM_ROLE: fog
    ports:
      - "8192:8080"

  edge1:
    <<: *node
    hostname: edge1
    environment:
      CONTINUUM_ROLE: edge1
    ports:
      - "8193:8080"

  edge2:
    <<: *node
    hostname: edge2
    environment:
      CONTINUUM_ROLE: edge2
    ports:
      - "8194:8080"

  edge3:
    <<: *node
    hostname: edge3
    environment:
      CONTINUUM_ROLE: edge3
    ports:
      - "8195:8080"

networks:
  continuum:
    driver: bridge
